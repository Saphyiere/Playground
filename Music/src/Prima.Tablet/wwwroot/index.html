    <title>Prima</title>
    <base href="/" />
    <!-- The look in use (MainLayout keeps it in local storage), set before the first paint so the app opens in it. -->

    <!-- Shown by Blazor when Prima has stopped answering: problems.js puts why in it, and keeps it for Settings › Problems. -->

        <span class="problem-lead">Prima stopped answering taps.</span>
        <span class="problem-what"></span>
        <span class="problem-kept">It's kept in Settings › Problems.</span>
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
