name: Prima release

# Builds Prima for the tablet, tests its logic, signs it with the key the owner's PC signs it with, and publishes it as a GitHub
# release, prima-1.0.N, with the app as prima.apk. Signed with the PC's key, it installs over the copy on the tablet as an
# update and keeps its data, whether that copy came from here or from Visual Studio. Run it from the Actions tab: Prima release,
# Run workflow. Music/README.md (Updates from GitHub) has the one-time setup and how Prima picks a release up.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new, in a sentence or two (optional: the release lists the commits since the last one)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: prima-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history and its tags, for the commits since the last release.
          fetch-depth: 0

      - name: The signing key
        env:
          KEYSTORE: ${{ secrets.PRIMA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The PRIMA_KEYSTORE_BASE64 secret isn't set. Music/README.md, Updates from GitHub, says how to add it."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/prima.keystore"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-dotnet@v5
        env:
          # A folder of the runner's own, so the Android workload installs without sudo.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "10.0.x"

      - name: The Android workload and SDK
        run: |
          dotnet workload install maui-android
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Test Prima's logic
        run: dotnet test --project Music/tests/Prima.Core.Tests

      - name: Build and sign
        env:
          # The debug key's own passwords and name, unless the secrets and variable say otherwise.
          STORE_PASS: ${{ secrets.PRIMA_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASS: ${{ secrets.PRIMA_KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ vars.PRIMA_KEY_ALIAS || 'androiddebugkey' }}
        run: >
          dotnet build Music/src/Prima.Tablet/Prima.Tablet.csproj -c Release
          -p:ApplicationDisplayVersion="$VERSION"
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/prima.keystore"
          -p:AndroidSigningStorePass=env:STORE_PASS
          -p:AndroidSigningKeyAlias="$KEY_ALIAS"
          -p:AndroidSigningKeyPass=env:KEY_PASS
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"

      - name: Check the signature
        id: apk
        env:
          # Optional: the SHA-256 of the key the tablet's Prima is signed with, so a build signed with any other is never published.
          EXPECTED: ${{ vars.PRIMA_SIGNING_SHA256 }}
        run: |
          apk=artifacts/bin/Prima.Tablet/release/com.saphyiere.prima-Signed.apk
          sha=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ -z "$sha" ]; then
            echo "::error::The app isn't signed."
            exit 1
          fi
          want=$(printf '%s' "$EXPECTED" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -n "$want" ] && [ "$sha" != "$want" ]; then
            echo "::error::Signed by $sha, not by the tablet's key ($want): it wouldn't install as an update, so it isn't published."
            exit 1
          fi
          echo "Signed by $sha"
          cp "$apk" "$RUNNER_TEMP/prima.apk"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          SHA: ${{ steps.apk.outputs.sha }}
        run: |
          previous=$(git for-each-ref --count=1 --sort=-creatordate --format='%(refname:short)' 'refs/tags/prima-*')
          {
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            if [ -n "$previous" ]; then
              printf 'Changes since %s:\n\n' "$previous"
              git log --max-count=40 --format='- %s' "$previous..HEAD" -- Music Kit
            else
              echo "The first Prima release from GitHub."
            fi
            printf '\nBuilt from %s. Signed by the key with SHA-256 %s.\n' "$(git rev-parse --short HEAD)" "$SHA"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "prima-$VERSION" "$RUNNER_TEMP/prima.apk#Prima $VERSION for the tablet" \
            --target "$GITHUB_SHA" --title "Prima $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
